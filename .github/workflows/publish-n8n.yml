# Publish n8n-nodes-soterai to npm
#
# PREREQUISITES:
#   - Set the NPM_TOKEN repository secret in GitHub Settings > Secrets > Actions.
#     Generate the token at https://www.npmjs.com with Automation type for CI usage.
#
# TRIGGER:
#   Push a tag matching "n8n-v*" (e.g. "n8n-v0.2.6") to trigger this workflow.
#   Example:
#     git tag n8n-v0.2.6
#     git push origin n8n-v0.2.6

name: Publish n8n Community Node

on:
  push:
    tags:
      - "n8n-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/integrations/n8n

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # No root `npm install` here on purpose. The root installs
      # eslint-plugin-react, which crashes under the ESLint 10 that
      # @n8n/node-cli runs ("contextOrFilename.getFilename is not a function"),
      # because ESLint resolves plugins from parent directories.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
