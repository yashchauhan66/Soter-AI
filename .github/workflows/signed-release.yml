# ═══════════════════════════════════════════════════════════════════════════════
# SoterAI IDE Guard — Signed & reproducible release
# ═══════════════════════════════════════════════════════════════════════════════
# This workflow closes the "signed-provenance" evidence gate HONESTLY. It:
#   1. Builds the VSIX from a clean checkout and records SHA-256 provenance.
#   2. Proves reproducibility by building a SECOND time on a fresh runner and
#      comparing the artifact hash — reproducibleBuildVerified only flips true
#      when the two hashes actually match.
#   3. Signs the VSIX ONLY if an organization-controlled certificate secret is
#      present, then verifies the signature. signatureVerified is set from the
#      real verification result, never hardcoded.
#
# Golden rules:
#   - Secrets are referenced only via ${{ secrets.* }} and NEVER printed.
#   - No gate flag is ever set without a real verification step behind it.
#   - Absent the org signing cert, the run still produces valid checksums and
#     an honest "unsigned-local-build" provenance — it does not fake a signature.
# ═══════════════════════════════════════════════════════════════════════════════

name: Signed Release

on:
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: "Publish to VS Code Marketplace + Open VSX after signing (human-approved)"
        type: boolean
        default: false
  push:
    tags:
      - "ide-guard-signed-v*"

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

defaults:
  run:
    shell: bash

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Build #1 — canonical build, tests, provenance + checksums
  # ───────────────────────────────────────────────────────────────────────────
  build-primary:
    name: build (primary) + provenance
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      vsix-sha256: ${{ steps.release.outputs.artifact_sha256 }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/soterai-lite-packager
      - run: npm --prefix packages/guard-core run build
      - name: Typecheck extension
        run: npm --prefix packages/soterai-lite run typecheck
      - name: Test extension
        run: npm --prefix packages/soterai-lite test
      - name: Test guard-core
        run: npm --prefix packages/guard-core test
      - name: Test Lite release receipts and package checks
        run: node --test packages/soterai-lite/scripts/__tests__/*.test.cjs

      - name: Package VSIX
        run: |
          mkdir -p artifacts
          node packages/soterai-lite/scripts/package.cjs --receipt-out artifacts/lite-primary-pointer.json
      - name: Verify VSIX contents and hash
        id: release
        run: node packages/soterai-lite/scripts/release-artifact.cjs resolve --pointer artifacts/lite-primary-pointer.json --github-output "$GITHUB_OUTPUT"
      - name: Exercise the packaged broker with synthetic loopback requests
        run: node packages/soterai-lite/scripts/smoke-broker.cjs --pointer artifacts/lite-primary-pointer.json --evidence-out artifacts/lite-primary-smoke

      - name: Read version
        id: meta
        run: echo "version=${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Generate provenance + checksums
        run: npm run release:vscode:provenance -- --pointer artifacts/lite-primary-pointer.json

      - name: Record VSIX hash
        id: hash
        env:
          VERIFIED_VSIX: ${{ steps.release.outputs.artifact_path }}
        run: |
          FILE="$VERIFIED_VSIX"
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Primary VSIX sha256: $SHA"

      - name: Upload primary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-primary
          path: |
            artifacts/lite-primary-pointer.json
            artifacts/lite-primary-smoke/result.json
            ${{ steps.release.outputs.artifact_path }}
            ${{ steps.release.outputs.build_attempt_path }}
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Build #2 — independent reproducibility check on a fresh runner
  # ───────────────────────────────────────────────────────────────────────────
  build-repro:
    name: build (reproducibility check)
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [build-primary]
    outputs:
      matches: ${{ steps.compare.outputs.matches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/soterai-lite-packager
      - name: Package VSIX (second build)
        run: |
          mkdir -p artifacts
          node packages/soterai-lite/scripts/package.cjs --receipt-out artifacts/lite-repro-pointer.json
      - name: Verify second VSIX contents and hash
        id: release
        run: node packages/soterai-lite/scripts/release-artifact.cjs resolve --pointer artifacts/lite-repro-pointer.json --github-output "$GITHUB_OUTPUT"
      - name: Compare hash to primary
        id: compare
        env:
          VERIFIED_VSIX: ${{ steps.release.outputs.artifact_path }}
          VERIFIED_VERSION: ${{ steps.release.outputs.version }}
          PRIMARY_VERSION: ${{ needs.build-primary.outputs.version }}
        run: |
          test "$VERIFIED_VERSION" = "$PRIMARY_VERSION"
          FILE="$VERIFIED_VSIX"
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          echo "Repro VSIX sha256:   $SHA"
          echo "Primary VSIX sha256: ${{ needs.build-primary.outputs.vsix-sha256 }}"
          if [ "$SHA" = "${{ needs.build-primary.outputs.vsix-sha256 }}" ]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
            echo "✅ Reproducible: hashes match."
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Not byte-reproducible yet — hashes differ. Provenance will record reproducibleBuildVerified=false."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Sign — only if org cert secret exists; verify before claiming signed
  # ───────────────────────────────────────────────────────────────────────────
  sign-and-finalize:
    name: sign (if cert present) + finalize provenance
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [build-primary, build-repro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/soterai-lite-packager
      - name: Download primary artifacts
        uses: actions/download-artifact@v4
        with:
          name: signed-release-primary
          path: .

      - name: Revalidate transferred Lite artifact and receipts
        id: release
        run: node packages/soterai-lite/scripts/release-artifact.cjs resolve --pointer artifacts/lite-primary-pointer.json --github-output "$GITHUB_OUTPUT"

      - name: Stage primary release evidence
        shell: bash
        env:
          PRIMARY_SHA: ${{ needs.build-primary.outputs.vsix-sha256 }}
          VERIFIED_SHA: ${{ steps.release.outputs.artifact_sha256 }}
          BUILD_ATTEMPT: ${{ steps.release.outputs.build_attempt_path }}
          SBOM_PATH: ${{ steps.release.outputs.sbom_path }}
          INVENTORY_PATH: ${{ steps.release.outputs.inventory_path }}
        run: |
          set -euo pipefail
          test "$PRIMARY_SHA" = "$VERIFIED_SHA"
          mkdir -p reports artifacts/security signing-evidence
          cp -- "$BUILD_ATTEMPT/release-provenance-attestation.json" reports/release-provenance-attestation.json
          cp -- "$BUILD_ATTEMPT/release-provenance-attestation.md" reports/release-provenance-attestation.md
          cp -- "$BUILD_ATTEMPT/vscode-release-checksums.sha256" reports/vscode-release-checksums.sha256
          cp -- "$SBOM_PATH" artifacts/security/vscode-extension.cdx.json
          cp -- "$INVENTORY_PATH" artifacts/security/vsix-integrity.json

      - name: Detect signing capability
        id: cap
        env:
          HAS_CERT: ${{ secrets.VSIX_SIGNING_CERT_BASE64 != '' && secrets.VSIX_SIGNING_CERT_PASSWORD != '' }}
        run: echo "can_sign=$HAS_CERT" >> "$GITHUB_OUTPUT"

      # vsce supports signing via a PFX/P12 certificate. We decode the org cert
      # from a secret, sign, then VERIFY. signatureVerified is derived from the
      # verify exit code — there is no path that sets it true without verifying.
      - name: Sign and verify VSIX
        id: sign
        if: steps.cap.outputs.can_sign == 'true'
        env:
          VSIX: ${{ steps.release.outputs.artifact_path }}
          CERT_B64: ${{ secrets.VSIX_SIGNING_CERT_BASE64 }}
          CERT_PW: ${{ secrets.VSIX_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          node tools/soterai-lite-packager/node_modules/@vscode/vsce/vsce generate-manifest -i "$VSIX" -o signing-evidence/manifest.json
          pwsh -NoProfile -NonInteractive -File packages/soterai-lite/scripts/sign-manifest.ps1 -ManifestPath signing-evidence/manifest.json -SignaturePath signing-evidence/signature.p7s
          # Verify the produced signature against the artifact. Non-zero exits fail the job.
          node tools/soterai-lite-packager/node_modules/@vscode/vsce/vsce verify-signature -i "$VSIX" -m signing-evidence/manifest.json -s signing-evidence/signature.p7s
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Verify the artifact is unchanged after signing
        run: node packages/soterai-lite/scripts/release-artifact.cjs resolve --pointer artifacts/lite-primary-pointer.json

      - name: Finalize provenance (honest flags)
        env:
          SIGNATURE_VERIFIED: ${{ steps.sign.outputs.verified == 'true' }}
          REPRODUCIBLE: ${{ needs.build-repro.outputs.matches == 'true' }}
          CAN_SIGN: ${{ steps.cap.outputs.can_sign }}
          SIGNATURE_PATH: signing-evidence/signature.p7s
          SIGNATURE_MANIFEST_PATH: signing-evidence/manifest.json
        run: |
          node scripts/finalize-signed-provenance.mjs

      - name: Upload finalized provenance
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-provenance
          path: |
            reports/release-provenance-attestation.json
            reports/release-provenance-attestation.md
            reports/vscode-release-checksums.sha256
            artifacts/security/vscode-extension.cdx.json
            artifacts/security/vsix-integrity.json
          if-no-files-found: error

      - name: Upload verified detached signature
        if: steps.sign.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-signature
          path: |
            signing-evidence/manifest.json
            signing-evidence/signature.p7s
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Signed Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Can sign (org cert present): ${{ steps.cap.outputs.can_sign }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signature verified: ${{ steps.sign.outputs.verified == 'true' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reproducible build verified: ${{ needs.build-repro.outputs.matches == 'true' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.cap.outputs.can_sign }}" != "true" ]; then
            echo "- ⚠️ No org signing certificate configured — this run produces honest checksums and an unsigned provenance. Add VSIX_SIGNING_CERT_BASE64 + VSIX_SIGNING_CERT_PASSWORD org secrets to sign." >> "$GITHUB_STEP_SUMMARY"
          fi
