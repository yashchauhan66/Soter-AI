name: Model Artisaft Security Scan

on:
  pull_request:
    paths:
      - "**/*.gguf"
      - "**/*.safetensors"
      - "**/*.onnx"
      - "**/*.pkl"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
  workflow_dispatch:

jobs:
  model-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Scan model artifacts
        run: npx soterai scan --path . --scan-depth=full
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soterai-model-scan
          path: artifacts/model-scan/
