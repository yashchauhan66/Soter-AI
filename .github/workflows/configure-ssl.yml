name: Configure production SSL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-ssl.yml
      - .github/workflows/ci-cd.yml

permissions:
  contents: read

jobs:
  ssl:
    name: Configure soterai.in HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Restart Docker app if stopped
        shell: bash
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'RESTART_SCRIPT'
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"

            echo "=== Docker container status ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null || echo "Docker not running"

            # Ensure docker socket is accessible
            [ -S /var/run/docker.sock ] && sudo chmod 666 /var/run/docker.sock 2>/dev/null || true

            # Restart any stopped soter containers
            for cname in soter-app soter-redis soter-qdrant; do
              STATUS=$(docker inspect --format='{{.State.Status}}' "$cname" 2>/dev/null || echo "missing")
              echo "  $cname: $STATUS"
              if [ "$STATUS" = "exited" ] || [ "$STATUS" = "created" ]; then
                echo "  Restarting $cname..."
                docker start "$cname" || true
              fi
            done

            # Wait and verify app is responding
            for i in $(seq 1 12); do
              sleep 5
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health 2>/dev/null || echo "000")
              if [ "$HTTP" = "200" ]; then
                echo "  ✅ App responding on port 3000 (attempt $i)"
                break
              fi
              echo "  Attempt $i: HTTP $HTTP, waiting..."
            done

            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health 2>/dev/null || echo "000")
            if [ "$HTTP" != "200" ]; then
              echo "  ⚠️  App not responding on port 3000 — SSL will configure but proxy may not work"
              echo "     Run CI/CD pipeline to redeploy the container"
            fi
          RESTART_SCRIPT

      - name: Install certificate and configure Nginx
        shell: bash
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'SSL_SCRIPT'
            set -euo pipefail

            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx certbot python3-certbot-nginx

            # Kill any stale certbot processes and remove lockfile from previous runs
            sudo pkill -f "certbot" 2>/dev/null || true
            sudo rm -f /var/lock/certbot /var/run/certbot.lock 2>/dev/null || true

            # ── Remove stale sites that serve the wrong (soterai.publicvm.com) cert ──
            # Any enabled site referencing the old hostname makes nginx present a cert
            # whose name is soterai.publicvm.com, triggering ERR_CERT_COMMON_NAME_INVALID
            # for visitors to soterai.in. Disable them and the default site.
            for f in $(sudo grep -rl "publicvm" /etc/nginx/sites-enabled/ /etc/nginx/sites-available/ 2>/dev/null); do
              echo "Removing stale nginx site: $f"
              sudo rm -f "$f" "/etc/nginx/sites-enabled/$(basename "$f")"
            done
            sudo rm -f /etc/nginx/sites-enabled/default

            # Drop the old publicvm certificate so nginx can't fall back to it.
            sudo certbot delete --cert-name soterai.publicvm.com --non-interactive 2>/dev/null || true

            sudo tee /etc/nginx/sites-available/soterai >/dev/null <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name soterai.in www.soterai.in api.soterai.in;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
          NGINX

            sudo ln -sfn /etc/nginx/sites-available/soterai /etc/nginx/sites-enabled/soterai
            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx

            # Try with email first, fall back to no-email if not set
            CERTBOT_EMAIL="admin@soterai.in"
            sudo certbot --nginx \
              --domains soterai.in,www.soterai.in,api.soterai.in \
              --expand \
              --non-interactive \
              --agree-tos \
              --email "$CERTBOT_EMAIL" \
              --redirect \
              --keep-until-expiring 2>/dev/null || \
            sudo certbot --nginx \
              --domains soterai.in,www.soterai.in,api.soterai.in \
              --expand \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email \
              --redirect \
              --keep-until-expiring

            sudo nginx -t
            sudo systemctl reload nginx
            sudo certbot renew --dry-run

            echo ""
            echo "=== Current certificate info ==="
            sudo certbot certificates 2>/dev/null || true
          SSL_SCRIPT

      - name: Verify HTTPS
        shell: bash
        run: |
          # 1. Confirm the served certificate actually covers soterai.in.
          #    Guards against the ERR_CERT_COMMON_NAME_INVALID regression where
          #    nginx served the old soterai.publicvm.com cert.
          SAN=$(echo | openssl s_client -connect soterai.in:443 -servername soterai.in 2>/dev/null \
            | openssl x509 -noout -ext subjectAltName 2>/dev/null)
          echo "Served SAN: $SAN"
          echo "$SAN" | grep -q "DNS:soterai.in" \
            || { echo "::error::Served certificate does not cover soterai.in"; exit 1; }

          # 2. Confirm the app responds over HTTPS on every hostname.
          curl --fail --silent --show-error --location --max-time 30 https://soterai.in/api/health
          curl --fail --silent --show-error --head --max-time 30 https://www.soterai.in/
          curl --fail --silent --show-error --location --max-time 30 https://api.soterai.in/api/health
