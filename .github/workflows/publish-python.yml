# Publish the `soter` Python SDK to PyPI
#
# TWO WAYS TO AUTHENTICATE. The workflow picks automatically:
#
# A) API TOKEN (simplest, always works). GitHub -> Settings -> Secrets and
#    variables -> Actions -> New repository secret, name it PYPI_API_TOKEN, and
#    paste a token from https://pypi.org/manage/account/token/ (scope: project
#    `soter`). Browser paste works, so this avoids the terminal getpass problem.
#
# B) TRUSTED PUBLISHING (OIDC, no stored secret) -- used only when no
#    PYPI_API_TOKEN secret exists.
#      1. https://pypi.org/manage/project/soter/settings/publishing/
#      2. "Add a new publisher" -> GitHub, then fill in EXACTLY:
#           Owner:            yashchauhan66
#           Repository:       Soter-AI
#           Workflow name:    publish-python.yml
#           Environment name: pypi
#      3. GitHub -> Settings -> Environments -> New environment -> name it "pypi"
#
# DO NOT use https://pypi.org/manage/account/publishing/ (the account-level page)
# for step B. That page creates a *pending* publisher for a NEW project name, and
# PyPI then mints an OIDC token scoped to that other name -- the upload of `soter`
# fails with "403 OIDC scoped token is not valid for project 'soter'". The
# publisher must be added on the project page in B1 above.
#
# HOW TO PUBLISH:
#   GitHub -> Actions -> "Publish Python SDK (PyPI)" -> "Run workflow",
#   or push a tag matching python-v*
#
# NOTE: PyPI never allows overwriting an existing version. Bump
# `version` in packages/python-sdk/pyproject.toml (and __version__ in
# soter/__init__.py) before every run.

name: Publish Python SDK (PyPI)

on:
  workflow_dispatch:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata (fails on bad README or missing fields)
        run: python -m twine check dist/*

      # PyPI can never overwrite an existing version. Catch that here with a clear
      # message instead of an opaque failure after the OIDC/upload step.
      - name: Fail fast if this version is already on PyPI
        run: |
          python - <<'PY'
          import glob, os, sys, urllib.error, urllib.request
          whl = os.path.basename(glob.glob('dist/*.whl')[0])
          name, version = whl.split('-')[:2]
          try:
              urllib.request.urlopen(f'https://pypi.org/pypi/{name}/{version}/json', timeout=30).read()
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f'OK: {name} {version} is not on PyPI yet.')
                  sys.exit(0)
              raise
          print(f'::error::{name} {version} is ALREADY on PyPI and can never be '
                'overwritten. Bump `version` in packages/python-sdk/pyproject.toml '
                'and `__version__` in soter/__init__.py, commit, then re-run.')
          sys.exit(1)
          PY

      - name: Show what will be published
        run: |
          ls -l dist/
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob('dist/*.whl')[0]
          z = zipfile.ZipFile(whl)
          name = [n for n in z.namelist() if n.endswith('METADATA')][0]
          keep = ('Name', 'Version', 'License-Expression', 'License', 'Project-URL', 'Requires-Python')
          for line in z.read(name).decode().splitlines():
              if line.startswith(keep):
                  print(line)
          PY

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: packages/python-sdk/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      # Two auth paths. Trusted publishing (OIDC) is preferred because nothing
      # secret is stored, but it needs a publisher registered on the PROJECT page
      # (see the header). If a PYPI_API_TOKEN secret exists, use that instead --
      # it works regardless of publisher config. Only the mode name is printed.
      - name: Detect auth mode
        id: auth
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Using API token from the PYPI_API_TOKEN secret."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "No PYPI_API_TOKEN secret set; using trusted publishing (OIDC)."
          fi

      - name: Publish to PyPI (trusted publishing)
        if: steps.auth.outputs.mode == 'oidc'
        uses: pypa/gh-action-pypi-publish@release/v1

      # Attestations are signed via OIDC, so they cannot be produced on this path.
      - name: Publish to PyPI (API token)
        if: steps.auth.outputs.mode == 'token'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
