# ═══════════════════════════════════════════════════════════════════════════════
# Soter Guard — CI/CD Pipeline (Unified)
# ═══════════════════════════════════════════════════════════════════════════════
# On push to main:
#   1. Build & Typecheck  (GitHub runner)
#   2. Run all tests      (GitHub runner)
#   3. Docker Build+Push  (GitHub runner → Docker Hub)
#   4. Deploy on EC2      (SSH → pull image → restart)
#
# On PR to main:
#   1. Build & Typecheck  (fast feedback only)
#   2. Run all tests
# ═══════════════════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/soter

  # ── CI-only env vars (not production secrets) ──
  CI: "true"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/soter_ci?schema=public
  AUTH_SECRET: ci-auth-secret-at-least-thirty-two-characters
  NEXTAUTH_SECRET: ci-auth-secret-at-least-thirty-two-characters
  NEXTAUTH_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  API_KEY_PEPPER: ci-api-key-pepper-at-least-thirty-two-characters
  WEBHOOK_WORKER_TOKEN: ci-webhook-worker-token-at-least-thirty-two-chars
  REPORT_WORKER_TOKEN: ci-report-worker-token-at-least-thirty-two-chars
  WEBHOOK_SECRET_PEPPER: ci-webhook-pepper-at-least-thirty-two-characters
  LOCAL_SECRET_STORE_KEY: ci-local-secret-key-at-least-thirty-two-characters
  SCIM_TOKEN_PEPPER: ci-scim-token-pepper-at-least-thirty-two-characters
  AUDIT_EXPORT_SECRET: ci-audit-export-secret-at-least-thirty-two-characters
  REPORT_SIGNING_SECRET: ci-report-signing-secret-at-least-thirty-two-characters
  EMAIL_PROVIDER: mock
  SECRET_STORE_PROVIDER: local
  VECTOR_PROVIDER: memory
  VECTOR_ALLOW_LOCAL_EMBEDDINGS: "true"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: Build & Typecheck
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: 🔨 Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soter_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soter_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      # packages/guard-core publishes types from dist/, which is gitignored.
      # It must be compiled before tsc/next can resolve @soterai/guard-core.
      - name: Build workspace packages
        run: npm run build:guard-core

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2: Run Tests
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soter_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soter_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      # Separate runner from the build job — dist/ is not carried over.
      - name: Build workspace packages
        run: npm run build:guard-core

      - name: Run tests
        run: npm test

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 3: Docker Build & Push to Docker Hub
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "   Image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          echo "   Image: ${{ env.DOCKER_IMAGE }}:latest"

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 4: Deploy to EC2
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload .env.production to EC2
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -z "$ENV_PRODUCTION" ]; then
            echo "❌ ENV_PRODUCTION secret is not set!"
            echo "   Go to GitHub → Settings → Secrets → Add ENV_PRODUCTION"
            exit 1
          fi
          printf '%s\n' "$ENV_PRODUCTION" > /tmp/soter-env-production
          scp /tmp/soter-env-production ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/soter-env-production
          rm -f /tmp/soter-env-production

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -s << 'DEPLOY_SCRIPT'
            set -e

            # ── Fix PATH for non-interactive SSH ───────────────────
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            [ -f ~/.bashrc ] && source ~/.bashrc 2>/dev/null || true
            [ -f ~/.profile ] && source ~/.profile 2>/dev/null || true

            REPO_DIR="/home/${{ secrets.EC2_USER }}/soter-guard"
            DOCKER_USERNAME="$(printf '%s' "${{ secrets.DOCKER_USERNAME }}" | tr -d '[:space:]')"
            DOCKER_TAG="${DOCKER_USERNAME}/soter"
            COMMIT_SHA="${{ github.sha }}"

            echo "═══════════════════════════════════════════════════"
            echo "  Soter Guard — Deploying to EC2"
            echo "  Commit: ${COMMIT_SHA}"
            echo "═══════════════════════════════════════════════════"

            # ── Step 1: Pull latest code (for docker-compose.yml) ──
            echo ""
            echo "[1/5] Pulling latest code..."
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git stash 2>/dev/null || true
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/yashchauhan66/Soter-AI.git
              git pull --rebase
              echo "  ✅ Repo updated"
            else
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/yashchauhan66/Soter-AI.git "$REPO_DIR"
              cd "$REPO_DIR"
              echo "  ✅ Repo cloned"
            fi

            # ── Step 2: Setup .env.production ──────────────────────
            echo ""
            echo "[2/5] Setting up environment..."
            if [ -f /tmp/soter-env-production ]; then
              mv /tmp/soter-env-production "$REPO_DIR/.env.production"
              chmod 600 "$REPO_DIR/.env.production"
              echo "  ✅ .env.production updated"
            elif [ ! -f "$REPO_DIR/.env.production" ]; then
              echo "  ❌ ERROR: .env.production not found!"
              exit 1
            fi

            # Keep the canonical production URL correct even when the stored
            # ENV_PRODUCTION secret still contains the retired hostname.
            sed -i \
              -e 's|^NEXTAUTH_URL=.*$|NEXTAUTH_URL=https://soterai.in|' \
              -e 's|^NEXT_PUBLIC_APP_URL=.*$|NEXT_PUBLIC_APP_URL=https://soterai.in|' \
              "$REPO_DIR/.env.production"

            # Same class of problem, worse failure mode: a model the runtime cannot
            # load makes augmentWithMl fail OPEN, so the ML detection tier goes dark
            # while rules keep running. Pin the paths at the model this commit ships.
            #
            # Written as a whole-value replacement rather than a pattern patch on the
            # existing path. The previous attempt required a literal =" and rewrote
            # only the directory component, so an unquoted or absolutely-prefixed
            # value in the secret silently did not match -- and the echo below could
            # not reveal that, because a line that still equals a line of the secret
            # gets masked to *** in the log. Assigning the full value removes every
            # dependence on how the secret happens to be spelled.
            ML_DIR="models/ml-classifier-v14"
            for pair in MODEL_PATH:model.onnx LABELS_PATH:labels.json CALIBRATION_PATH:calibration.json; do
              var="ML_ONNX_${pair%%:*}"
              file="${pair##*:}"
              if grep -qE "^${var}=" "$REPO_DIR/.env.production"; then
                sed -i -E "s#^${var}=.*#${var}=\"${ML_DIR}/${file}\"#" "$REPO_DIR/.env.production"
              else
                printf '%s="%s"\n' "$var" "${ML_DIR}/${file}" >> "$REPO_DIR/.env.production"
              fi
            done
            # v14 trained at max_length 256 (models/ml-classifier-v14/training_stats.json
            # -> architecture.max_length). A secret that disagrees does not fail to load,
            # it silently tokenizes differently than training did, so pin it alongside
            # the paths rather than trusting the two to stay in step.
            if grep -qE '^ML_ONNX_MAX_LENGTH=' "$REPO_DIR/.env.production"; then
              sed -i -E 's#^ML_ONNX_MAX_LENGTH=.*#ML_ONNX_MAX_LENGTH="256"#' "$REPO_DIR/.env.production"
            else
              echo 'ML_ONNX_MAX_LENGTH="256"' >> "$REPO_DIR/.env.production"
            fi
            # Print only the directory name. The full line is a secret line and would
            # be masked; a bare "ml-classifier-v14" is not, so this is the one form of
            # the check that is actually readable in the log.
            MODEL_PATH=$(sed -nE 's#^ML_ONNX_MODEL_PATH="?([^"]*)"?[[:space:]]*$#\1#p' \
              "$REPO_DIR/.env.production" | head -1)
            echo "  ML model dir: $(basename "$(dirname "$MODEL_PATH")")  max_length: 256"

            # ── Step 3: Login to Docker Hub ────────────────────────
            echo ""
            echo "[3/5] Logging in to Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
            echo "  ✅ Docker Hub logged in"

            # ── Step 3.5: Free disk space before pull ──────────────
            echo ""
            echo "[3.5/5] Checking disk space..."
            df -h /var/lib/docker /var/lib/containerd 2>/dev/null || true
            echo "  Freeing disk before pull..."
            # NO --filter "until=24h" here. That filter reclaimed exactly 0B and let the
            # disk fill up: every superseded image is tagged with its own commit SHA, so
            # on a day with several deploys they are all YOUNGER than 24h and the filter
            # excluded precisely the images that were worth deleting. Run 32519571933
            # then died mid-pull with "no space left on device" at 90% full.
            # Unfiltered `image prune -a` never removes an image that a container is
            # using, so the currently-serving container is safe; rollback stays available
            # by re-pulling the older SHA tag from Docker Hub.
            docker image prune -a --force </dev/null 2>/dev/null || true
            docker builder prune -f </dev/null 2>/dev/null || true
            docker system prune -f --volumes </dev/null 2>/dev/null || true
            df -h /var/lib/docker /var/lib/containerd 2>/dev/null || true
            # Assert the headroom instead of letting the pull fail inside containerd,
            # where it surfaces as a layer-extract error naming a model file and reads
            # like a model bug rather than a full disk.
            AVAIL_MB=$(df -Pm / | awk 'NR==2{print $4}')
            echo "  Free on / after cleanup: ${AVAIL_MB} MB"
            if [ "${AVAIL_MB:-0}" -lt 4096 ]; then
              echo "  ❌ Only ${AVAIL_MB} MB free on / — unpacking this image needs ~3 GB."
              echo "     Cleanup could not reclaim enough space. Inspect on the host with:"
              echo "       docker system df && sudo du -xhd1 / | sort -h | tail -20"
              exit 1
            fi

            # ── Step 4: Pull latest Docker image ───────────────────
            echo ""
            echo "[4/5] Pulling latest Docker image..."
            docker pull "${DOCKER_TAG}:${COMMIT_SHA}"
            docker tag "${DOCKER_TAG}:${COMMIT_SHA}" "${DOCKER_TAG}:latest"
            echo "  ✅ Image pulled: ${DOCKER_TAG}:${COMMIT_SHA}"

            # ── Step 4.5: check the model BEFORE recreating the live container ──
            # A throwaway container off the image just pulled, so a bad artifact is
            # caught while the previous version is still serving. Every command here
            # redirects stdin from /dev/null: this whole script arrives on ssh's stdin
            # via `bash -s`, and any command that reads stdin eats the rest of it.
            # `docker ... exec`/`run` does exactly that -- it is what silently ate the
            # earlier version of this check, along with the nginx reload and the final
            # summary, and left bash to hit EOF and exit 0 with the tier dark.
            echo ""
            echo "[4.5/5] Verifying ML model inside the image..."
            MODEL_BYTES=$(docker run --rm --entrypoint sh "${DOCKER_TAG}:${COMMIT_SHA}" \
              -c "wc -c < '$MODEL_PATH' 2>/dev/null || echo 0" </dev/null | tr -dc '0-9')
            if [ -z "$MODEL_BYTES" ] || [ "$MODEL_BYTES" = "0" ]; then
              echo "  ❌ $MODEL_PATH is absent from the image — the ML tier would fail OPEN."
              echo "     Rules still protect traffic, but ML detection would be gone."
              echo "     Refusing to recreate the container; the running version is untouched."
              exit 1
            elif [ "$MODEL_BYTES" -lt 1000000 ]; then
              echo "  ❌ $MODEL_PATH is only $MODEL_BYTES bytes — git-lfs pointers were"
              echo "     shipped instead of weights (a pointer is ~133 bytes). Checkout"
              echo "     needs 'lfs: true'. Refusing to deploy a dark ML tier."
              exit 1
            else
              echo "  ✅ model present in image: $MODEL_BYTES bytes"
            fi

            # ── Step 5: Deploy containers ──────────────────────────
            echo ""
            echo "[5/5] Deploying containers..."
            export DOCKER_IMAGE="${DOCKER_TAG}"

            # Detect docker compose (V2 plugin or V1 binary)
            COMPOSE=""
            if docker compose version >/dev/null 2>&1 && docker compose --help 2>/dev/null | grep -q -- "--env-file"; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1 && docker-compose --help 2>/dev/null | grep -q -- "--env-file"; then
              COMPOSE="docker-compose"
            elif [ -x /usr/local/bin/docker-compose ] && /usr/local/bin/docker-compose --help 2>/dev/null | grep -q -- "--env-file"; then
              COMPOSE="/usr/local/bin/docker-compose"
            elif [ -x /usr/bin/docker-compose ] && /usr/bin/docker-compose --help 2>/dev/null | grep -q -- "--env-file"; then
              COMPOSE="/usr/bin/docker-compose"
            fi

            if [ -n "$COMPOSE" ]; then
              # ── Deploy via docker compose ──
              echo "  Using compose: $COMPOSE"
              $COMPOSE --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate app redis qdrant
            else
              # ── Fallback: deploy via plain docker run ──
              echo "  docker compose not found — using docker run directly"

              # Create shared network
              docker network create soter-net 2>/dev/null || true

              # Stop old containers
              docker rm -f soter-redis soter-qdrant soter-app 2>/dev/null || true

              # Start Redis
              echo "  Starting Redis..."
              docker run -d \
                --name soter-redis \
                --network soter-net \
                --restart unless-stopped \
                -v soter-redis-data:/data \
                redis:7-alpine \
                redis-server --appendonly yes

              # Start Qdrant
              echo "  Starting Qdrant..."
              docker run -d \
                --name soter-qdrant \
                --network soter-net \
                --restart unless-stopped \
                -v soter-qdrant-data:/qdrant/storage \
                qdrant/qdrant:v1.14.1

              # Wait for dependencies to be ready
              echo "  Waiting for Redis & Qdrant..."
              sleep 5

              # Start App
              echo "  Starting App..."
              docker run -d \
                --name soter-app \
                --network soter-net \
                --restart unless-stopped \
                --env-file "$REPO_DIR/.env.production" \
                -e NODE_ENV=production \
                -e VECTOR_PROVIDER=qdrant \
                -e QDRANT_URL=http://soter-qdrant:6333 \
                -e REDIS_URL=redis://soter-redis:6379 \
                -p 0.0.0.0:3000:3000 \
                "${DOCKER_TAG}:latest"
            fi

            # Clean up old images
            docker image prune -a --filter "until=24h" --force 2>/dev/null || true

            # Health check (wait up to 60 seconds)
            echo ""
            echo "  Waiting for health check..."
            HTTP_CODE="000"
            for i in $(seq 1 12); do
              sleep 5
              HTTP_CODE=$(curl -s -o /tmp/soter-health.json -w "%{http_code}" \
                http://127.0.0.1:3000/api/health 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "  ✅ Health check PASSED (attempt $i)"
                break
              fi
              echo "  Attempt $i: HTTP $HTTP_CODE, retrying..."
            done

            if [ "$HTTP_CODE" != "200" ]; then
              echo "  ⚠️  Health check got HTTP $HTTP_CODE (app may still be starting)"
              if [ -n "$COMPOSE" ]; then
                $COMPOSE --env-file .env.production logs --tail=30 app </dev/null
              else
                docker logs --tail=30 soter-app </dev/null
              fi
            fi

            # The file existing in the image does not prove the runtime loaded it: a
            # rejected signature, an unreadable path or a failed-open request all leave
            # rules-only traffic behind an app that looks fine. /api/health publishes
            # the tier's real state, so assert on that rather than on the file.
            HEALTH_BODY=$(cat /tmp/soter-health.json 2>/dev/null || echo "{}")
            echo "  guard: $(printf '%s' "$HEALTH_BODY" | tr -d ' \n' | sed -nE 's/.*"guard":(\{.*\}),"timestamp".*/\1/p')"
            ML_MODE=$(printf '%s' "$HEALTH_BODY" | tr -d ' \n' | sed -nE 's/.*"ml":\{"mode":"([a-z]+)".*/\1/p')
            ML_STATUS=$(printf '%s' "$HEALTH_BODY" | tr -d ' \n' | sed -nE 's/.*"ml":\{[^}]*"status":"([a-z]+)".*/\1/p')
            if [ -z "$ML_MODE" ]; then
              # No guard block at all — getGuardHealth() threw, or this build predates
              # the field. Inconclusive is not the same as broken, so warn only.
              echo "  ⚠️  health response carries no guard block; ML tier UNVERIFIED"
            elif [ "$ML_MODE" = "off" ]; then
              echo "  ℹ️  ML tier is configured off; running on deterministic rules only."
            elif [ "$ML_STATUS" = "degraded" ]; then
              echo "  ❌ ML tier is DEGRADED while configured as \"$ML_MODE\": detection is"
              echo "     running on rules only. The model file IS present in the image"
              echo "     ($MODEL_BYTES bytes), so this is a load or verification failure,"
              echo "     not a missing artifact. Run 'npm run ml:health' on the host for"
              echo "     the reason (it names paths, so it is not exposed publicly)."
              echo "     Rollback: point ML_ONNX_*_PATH at models/ml-classifier-v7 and redeploy."
              echo "     The container is already live — this fails the run to make it"
              echo "     visible, it does not restore the previous version."
              exit 1
            else
              echo "  ✅ ML tier healthy and enforcing ($ML_MODE, model $MODEL_BYTES bytes)"
            fi

            # Reload nginx if present
            if command -v nginx >/dev/null 2>&1; then
              echo ""
              echo "  Reloading nginx..."
              sudo nginx -t && sudo systemctl reload nginx && echo "  ✅ nginx reloaded" || echo "  ⚠️  nginx reload skipped"
            fi

            echo ""
            echo "═══════════════════════════════════════════════════"
            echo "  ✅ Deployment Complete!"
            echo "  Image: ${DOCKER_TAG}:${COMMIT_SHA}"
            echo "═══════════════════════════════════════════════════"
          DEPLOY_SCRIPT

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "   Image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          echo "   Server: ${{ secrets.EC2_HOST }}"
          echo "   Health: http://${{ secrets.EC2_HOST }}:3000/api/health"
