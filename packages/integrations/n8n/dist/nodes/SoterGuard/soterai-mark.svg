<?xml version="1.0" encoding="UTF-8"?>
<!--
  SoterAI node mark — light canvas (n8n's default).

  Emblem only, no wordmark. n8n draws a node icon at roughly 40-60px inside the
  node box, where "SoterAI" set alongside the emblem is illegible and only
  muddies the mark. What is kept is what survives at that size and is
  recognisably this brand: the circular ring, the shield, the keyhole, and the
  gold crown finial descending through the ring.

  The S-ribbon from the full logo is deliberately dropped. At 48px its stroke
  and the shield's stroke collide into a grey smudge; the keyhole carries the
  "security" reading on its own and stays crisp.

  Background is genuinely transparent — there is no <rect> fill — so it sits
  correctly on n8n's light canvas and in the node palette. public/icon-512.png
  is NOT usable here: it has a baked dark navy background and would render as a
  dark square.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="SoterAI">
  <defs>
    <linearGradient id="soterRing" x1="9" y1="12" x2="55" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="soterShield" x1="18" y1="20" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="soterCrown" x1="28" y1="2" x2="36" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="32" cy="34" r="25" stroke="url(#soterRing)" stroke-width="2.6" fill="none"/>

  <!-- Shield -->
  <path
    d="M32 19.5 46 25v12c0 6.2-5.7 10.7-14 14.3C23.7 47.7 18 43.2 18 37V25z"
    stroke="url(#soterShield)"
    stroke-width="3"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Keyhole -->
  <g fill="url(#soterShield)">
    <circle cx="32" cy="33" r="4.3"/>
    <path d="M30.1 36.2h3.8l-1.2 7.6h-1.4z"/>
  </g>

  <!-- Crown finial: crosses the ring at the top, as in the full logo -->
  <g fill="url(#soterCrown)">
    <circle cx="32" cy="3.6" r="2.2"/>
    <path d="M27.4 7h9.2l-1.6 4.4h-6z"/>
    <path d="M29 12.2h6l-1 3.2h-4z"/>
    <rect x="31" y="15.4" width="2" height="4.4" rx="0.9"/>
  </g>
</svg>
