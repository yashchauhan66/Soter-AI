<?xml version="1.0" encoding="UTF-8"?>
<!--
  SoterAI node mark — dark canvas.

  Identical geometry to soterai-mark.svg; only the gradient stops are lifted.
  The light-canvas mark ends on #2563eb, which is close enough to n8n's dark
  editor background that the lower-right of the ring visually disappears. Here
  the ring and shield run from #7dd3fc to #3b82f6 and the crown from #fef3c7,
  so every stroke keeps contrast against a dark surface.

  Transparent background — no <rect> fill.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="SoterAI">
  <defs>
    <linearGradient id="soterRingDark" x1="9" y1="12" x2="55" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="soterShieldDark" x1="18" y1="20" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="soterCrownDark" x1="28" y1="2" x2="36" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="32" cy="34" r="25" stroke="url(#soterRingDark)" stroke-width="2.6" fill="none"/>

  <!-- Shield -->
  <path
    d="M32 19.5 46 25v12c0 6.2-5.7 10.7-14 14.3C23.7 47.7 18 43.2 18 37V25z"
    stroke="url(#soterShieldDark)"
    stroke-width="3"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Keyhole -->
  <g fill="url(#soterShieldDark)">
    <circle cx="32" cy="33" r="4.3"/>
    <path d="M30.1 36.2h3.8l-1.2 7.6h-1.4z"/>
  </g>

  <!-- Crown finial: crosses the ring at the top, as in the full logo -->
  <g fill="url(#soterCrownDark)">
    <circle cx="32" cy="3.6" r="2.2"/>
    <path d="M27.4 7h9.2l-1.6 4.4h-6z"/>
    <path d="M29 12.2h6l-1 3.2h-4z"/>
    <rect x="31" y="15.4" width="2" height="4.4" rx="0.9"/>
  </g>
</svg>
