<!--
  Activity-bar icon for the SoterAI Guard container.

  This is the saffron SoterAI mark (media/Bestlogo.png) — the same hexagonal
  shield with a keyhole core — reduced to a monochrome outline. The saffron
  (#F96403) cannot be carried over here: VS Code masks this file to its alpha
  channel and repaints it with the activity-bar foreground colour, so every fill
  colour in the file is discarded. A recoloured copy of the orange logo would
  therefore render as an indistinct filled blob at 24x24, not as a saffron icon.
  Saffron lives where it survives: the marketplace icon (media/Bestlogo.png) and
  the galleryBanner.

  Recovered from the 0.4.0 VSIX after the working-tree copy was deleted while the
  manifest's viewsContainers entry still pointed here — 0.4.1 packaged an
  activity-bar icon that did not exist in the archive. Do not repoint this at
  Bestlogo.png: it is the 512x512 full-colour raster, which masks to a solid
  square. The retired media/icon.png raster was dropped from the package in
  0.4.1+ after the manifest stopped referencing it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <path fill="currentColor" fill-rule="evenodd" d="M12 1.35 21.1 6.6v10.8L12 22.65 2.9 17.4V6.6L12 1.35Zm0 2.02L4.65 7.61v8.78L12 20.63l7.35-4.24V7.61L12 3.37Z"/>
  <path fill="currentColor" d="M12 7.9a2.45 2.45 0 0 0-1.32 4.51L9.9 16.1h4.2l-.78-3.69A2.45 2.45 0 0 0 12 7.9Z"/>
</svg>
